name: Python security and compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the locked application dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run offline compatibility tests
        run: python -P -m unittest discover -s tests -v
      - name: Audit the lockfile in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install pip-audit
          "$RUNNER_TEMP/audit/bin/pip-audit" -r requirements.txt --no-deps --disable-pip --strict
