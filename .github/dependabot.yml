# Group all dependency updates per ecosystem; security updates use their own group.
version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  groups:
    python-security-updates:
      applies-to: security-updates
      patterns:
      - '*'
    routine-updates:
      applies-to: version-updates
      patterns:
      - '*'
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
  open-pull-requests-limit: 1
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    routine-updates:
      applies-to: version-updates
      patterns:
      - '*'
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
